project:
  type: book
  output-dir: _book

book:
  title: "Automated Author Test Run"
  author: "Daniel Duvernais"
  chapters:
    - index.qmd
    - database-fundamentals.qmd
    - system-normalization.qmd
  appendices:
    - appendix-telemetry.qmd

bibliography: "references.bib"

execute:
  freeze: true

format:
  html:
    theme: cosmo
  pdf:
    documentclass: scrbook
    classoption: [twoside, openright]
    geometry:
      - paperwidth=6in
      - paperheight=9in
      - top=0.75in
      - bottom=0.75in
      - inner=0.75in
      - outer=0.625in
      - bindingoffset=0.25in
